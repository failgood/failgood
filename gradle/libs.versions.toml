[versions]
kotlin = "2.1.21"
kotlinx-coroutines = "1.10.2"
junit-platform = "1.12.2"
junit-jupiter = "5.12.2"
pitest = "1.30.0"
slf4j = "2.0.17"
kotlin-logging = "7.0.13"
kotlin-logging-microutils = "3.0.5"
logback = "1.5.18"
opentest4j = "1.3.0"
blockhound = "1.0.14.RELEASE"
mockk = "1.14.5"
gradle-tooling = "9.0.0"
jackson = "2.20.0"
jsoup = "1.21.2"
kover = "0.9.2"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-debug = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-debug", version.ref = "kotlinx-coroutines" }

# JUnit Platform
junit-platform-commons = { module = "org.junit.platform:junit-platform-commons", version.ref = "junit-platform" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-engine", version.ref = "junit-platform" }

# JUnit Jupiter
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlin-logging-microutils = { module = "io.github.microutils:kotlin-logging-jvm", version.ref = "kotlin-logging-microutils" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Testing
pitest = { module = "org.pitest:pitest", version.ref = "pitest" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }
blockhound = { module = "io.projectreactor.tools:blockhound", version.ref = "blockhound" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# Gradle
gradle-tooling-api = { module = "org.gradle:gradle-tooling-api", version.ref = "gradle-tooling" }

# Jackson
jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# Other
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# Self reference for testing
failgood = { module = "dev.failgood:failgood", version = "0.9.1" }

[bundles]
# Common Jackson dependencies
jackson = ["jackson-dataformat-xml", "jackson-module-kotlin"]

[plugins]
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
